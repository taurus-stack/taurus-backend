[tool.poetry]
name = "taurus-backend"
version = "0.1.0"
description = ""
authors = ["jinweijie <jinweijie0527@outlook.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12.11,<3.13"
django = "4.2.7"
django-comment-migrate = "0.1.7"
django-cors-headers = "4.3.0"
django-filter = "25.1"
django-ranged-response = "0.2.0"
djangorestframework = "3.14.0"
django-restql = "0.15.3"
django-simple-captcha = "0.5.20"
django-timezone-field = "6.0.1"
djangorestframework-simplejwt = "^5.4.0"
pymysql = "1.1.1"
pypinyin = "0.49.0"
ua-parser = "0.18.0"
pyparsing = "3.1.1"
openpyxl = "3.1.2"
requests = "2.31.0"
typing-extensions = "4.8.0"
tzlocal = "5.1"
# channels = "3.0.5"  # 已移除，改用纯 asyncio WebSocket
# channels-redis = "4.1.0"  # 已移除
websockets = "^12.0"  # 升级以支持最新 asyncio API
user-agents = "2.2.0"
six = "1.16.0"
whitenoise = "6.6.0"
uvicorn = "0.23.2"
gunicorn = "21.2.0"
gevent = "23.9.1"
pillow = "10.1.0"
dvadmin-celery = "1.0.5"
drf-spectacular = {extras = ["sidecar"], version = "^0.29.0"}
keyring = "^25.7.0"
colorlog = "^6.10.1"
channels = "^4.3.2"
django-extensions = "^4.1"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest-django (>=4.12.0,<5.0.0)"
]
